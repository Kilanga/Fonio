development:
  adapter: async

test:
  adapter: test

production:
  # async (in-process) rather than redis: the Gemfile doesn't include the
  # redis gem, and for a single-dyno hackathon demo there's no need for a
  # separate pub/sub backend — async keeps Turbo Streams broadcasting
  # working without an extra Heroku add-on. If this ever runs on more than
  # one web dyno, switch back to redis (uncomment `gem "redis"` in the
  # Gemfile and add the Heroku Redis add-on) since async doesn't share
  # state across processes.
  adapter: async
